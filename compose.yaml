# Servicios del Sistema de Inventario Tecnologico (Creation Technologies).
# Nombres exigidos por las practicas: nginx, app y db (no cambiarlos).
# Solo el puerto 80 de nginx queda expuesto al anfitrion.

services:
  app:
    build: ./app
    container_name: inventario_app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      ORGANIZACION: ${ORGANIZACION}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_interna

  nginx:
    image: nginx:1.28-alpine
    container_name: inventario_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - red_interna

  db:
    image: mysql:8.4
    container_name: inventario_db
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - datos_mysql:/var/lib/mysql
      # init.sql se ejecuta SOLO la primera vez, con el volumen vacio.
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - red_interna

networks:
  red_interna:
    driver: bridge

volumes:
  datos_mysql:
