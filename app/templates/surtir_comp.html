<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surtir Componente — {{ organizacion }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="body-surtir">
    <header>
        <nav class="menu-principal">
            <a href="/">Inventario</a>
            <a href="/pedir">Pedir componentes</a>
            <a href="/surtir">Surtir</a>
            <a href="/historial">Historial</a>
            <button type="button" onclick="cerrarSesion()">Cerrar sesión</button>
        </nav>
    </header>
    <div class="Titulo_surtir_componente">
        <h1>Surtir Componente</h1>
    </div>
    <div class="Formulario_surtir_componente">
        <label for="id_comp">Componente:</label>
        <input list="lista_componentes" id="id_comp" name="id_comp" required>
        <label for="cantidad_comp">Cantidad:</label>
        <input type="number" id="cantidad_comp" name="cantidad_comp" min="1" step="1" value="1" required>
        <label for="ubicacion_comp">Ubicación (opcional, vacío = primera existente):</label>
        <input type="text" id="ubicacion_comp" name="ubicacion_comp" placeholder="A1">

        <datalist id="lista_componentes"></datalist>
        <br><br>
        <button id="btnAgregarComp" type="button">Agregar</button>
    </div>
    <div class="comp_añadidos">
        <h2>Componentes añadidos</h2>
        <ul id="lista_añadidos"></ul>
        <button type="button" id="btnConfirmarPet" disabled>Confirmar petición</button>
        <p id="mensaje_peticion" role="status" aria-live="polite"></p>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
