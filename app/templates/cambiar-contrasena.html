<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña — {{ organizacion }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
    <div class="login-box">
        <div class="login-brand">{{ organizacion }}</div>
        <h2 class="login-heading">Cambiar contraseña</h2>
        <form id="form-cambiar-contrasena">
            <label for="actual">Contraseña actual:</label>
            <input type="password" id="actual" name="actual" required>

            <label for="nueva">Contraseña nueva:</label>
            <input type="password" id="nueva" name="nueva" minlength="6" required>

            <label for="confirmar">Confirmar contraseña nueva:</label>
            <input type="password" id="confirmar" name="confirmar" minlength="6" required>

            <button type="submit">Actualizar</button>
            <p id="errorMsg" class="error"></p>
            <p id="okMsg" class="ok"></p>
        </form>
        <p><a href="/">Volver al inventario</a></p>
    </div>
    <script>
        document.querySelector("#form-cambiar-contrasena").addEventListener("submit", async (event) => {
            event.preventDefault();
            const errorMsg = document.querySelector("#errorMsg");
            const okMsg = document.querySelector("#okMsg");
            errorMsg.textContent = "";
            okMsg.textContent = "";
            const nueva = document.querySelector("#nueva").value;
            if (nueva !== document.querySelector("#confirmar").value) {
                errorMsg.textContent = "La contraseña nueva y su confirmación no coinciden.";
                return;
            }
            try {
                const respuesta = await fetch("/api/cambiar-contrasena", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        actual: document.querySelector("#actual").value,
                        nueva
                    })
                });
                const data = await respuesta.json();
                if (!respuesta.ok) {
                    errorMsg.textContent = data.error || "No se pudo cambiar la contraseña.";
                    return;
                }
                okMsg.textContent = data.mensaje;
                event.target.reset();
            } catch (error) {
                errorMsg.textContent = "Error al conectar con el servidor.";
            }
        });
    </script>
</body>
</html>
